<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>metatron web server example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css"/>
    <style>
        .terminal-frame {
            width: 80vw;
            height: 80vh;
        }
    </style>
    <style>
        .flex-container {
            display: flex;
            width: 50%;
        }

        .panel {
            flex: 1;
            border: 0px solid #ccc;
            padding: 0px;
            margin: 0px;
            font-size: 13pt;
        }

        hr {
            background-color: red;
            height: 2px;
            border: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function () {
            $("#nenofhat").load("nenofhat.html");
            $("#metatron_title").load("metatron_title.html");
        });
    </script>
</head>
<body style="background-color: #282c34;">
<div class="flex-container">

    <pre>
        <div class="panel" id="nenofhat"></div>
    </pre>
    <pre>
    <div class="panel" id="metatron_title"></div>
         <pre style="font-size:13pt;color:#AAAAAA;margin:0px;padding:0px;font-family:'Courier New', monospace;">&gt; ttyd -p 7681 --writable metatron</pre>
        </pre>
</div>
<div class="container">
    <iframe class="terminal-frame" src="http://localhost:7681" title="Terminal"></iframe>
</div>
</body>
</html>
