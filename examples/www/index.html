<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>metatron web server example</title>
    <style>
        .flex-container {
            display: flex;
            width: 50%;
        }

        .panel {
            flex: 1;
            border: 0px solid #ccc;
            padding: 0px;
            margin: 0px;
        }

        textarea {
            width: 50%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
        }

        hr {
            background-color: red;
            height: 2px;
            border: none;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            const script = document.createElement("script");
            script.src = "metatron.js";
            script.host = "ws://localhost:8999";
            document.body.appendChild(script);
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function () {
            $("#nenofhat").load("nenofhat.html");
            $("#metatron_title").load("metatron_title.html");
        });
    </script>
</head>
<body style="background-color: #282c34;">
<div class="flex-container">
    <div id="nenofhat" class="panel"></div>
    <div class="panel">
        <pre style="color=#AAAAAA; font-size:20pt; line-height:20pt; font-family: 'Courier New', monospace;">
<div id="metatron_title"></div>
</pre>
    </div>
</div>
<hr/>
<div style="font-size:18pt">
    <div>
        <input type="text" style="font-size:18pt; text-align:left;" id="metatron_node" value="ws://127.0.0.1:8888">
        <button id="connectBtn">connect</button>
    </div>
    <div>
        <textarea style="font-size:18pt; text-align:left;" id="messageInput" rows="10">
start(1)-<[he,ll]_/prod()\_==[_,o]>-{,}          
        </textarea>
    </div>
    <div>
        <button id="sendBtn">send obj</button>
    </div>
    <ul style="color:red;" id="messages"></ul>
</div>
</body>
</html>
