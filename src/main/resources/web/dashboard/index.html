<!DOCTYPE html>
<html lang="en">
<head>
    <title>metatron dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Metatron Dashboard - Real-time monitoring and control">
    <!-- CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Base metatron styles (shared with website) + dashboard-specific styles -->
    <link href="metatron.css" rel="stylesheet">
    <link href="dashboard-only.css" rel="stylesheet">
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="mtron.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- NAVIGATION BAR -->
<nav class="navbar navbar-expand-lg bg-secondary sticky-top py-2 px-4">
    <a href="#" class="navbar-brand">
        <h4 class="mb-0 text-primary logo-text">
            <i class="bi bi-soundwave me-2"></i>
            metatron dashboard
        </h4>
    </a>
    <div class="ms-auto d-flex align-items-center">
        <span id="connectionStatus" class="badge bg-danger me-3">
            <i class="bi bi-wifi-off me-1"></i>disconnected
        </span>
        <div class="input-group input-group-sm" style="width: 280px;">
            <span class="input-group-text bg-dark border-secondary text-light">
                <i class="bi bi-hdd-network"></i>
            </span>
            <input type="text" id="wsEndpoint" class="form-control bg-dark border-secondary text-light"
                   value="ws://localhost:8999" placeholder="WebSocket URL">
            <button id="connectBtn" class="btn btn-primary" type="button">
                <i class="bi bi-plug"></i>
            </button>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<main class="container-fluid flex-grow-1 p-3">
    <div class="row g-3 h-100">

        <!-- PANEL 1: Active Spaces -->
        <div class="col-lg-3">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-collection me-2"></i>active spaces</span>
                    <button id="refreshSpacesBtn" class="btn btn-sm btn-outline-primary" title="Refresh">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
                <div class="card-body p-0 overflow-auto" style="max-height: calc(100vh - 180px);">
                    <div id="spacesContainer" class="list-group list-group-flush">
                        <div class="text-center text-muted py-4">
                            <i class="bi bi-wifi-off fs-1"></i>
                            <p class="mt-2">connect to view spaces</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL 2: URI Tree Browser -->
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-diagram-3 me-2"></i>uri address space</span>
                    <div class="input-group input-group-sm" style="width: 200px;">
                        <input type="text" id="treePathInput" class="form-control form-control-sm bg-dark border-secondary text-light"
                               placeholder="enter uri path..." value="">
                        <button id="browsePathBtn" class="btn btn-sm btn-outline-primary" title="Browse">
                            <i class="bi bi-folder2-open"></i>
                        </button>
                    </div>
                </div>
                <div class="card-body p-2 overflow-auto" style="max-height: calc(100vh - 180px);">
                    <div id="treeContainer" class="tree-view">
                        <div class="text-center text-muted py-4">
                            <i class="bi bi-diagram-3 fs-1"></i>
                            <p class="mt-2">select a space to browse</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL 3 & 4: Object Inspector + Console stacked -->
        <div class="col-lg-5 d-flex flex-column" style="gap: 12px;">

            <!-- PANEL 3: Object Inspector -->
            <div class="card" style="flex: 0 0 auto; max-height: 40vh;">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-search me-2"></i>obj inspector</span>
                    <span id="inspectorUri" class="text-muted small" style="font-family: monospace;"></span>
                </div>
                <div class="card-body p-2 overflow-auto">
                    <div id="inspectorContainer" class="inspector-output">
                        <div class="text-muted small text-center py-3">
                            <i class="bi bi-crosshair fs-3 d-block mb-2"></i>
                            Click a tree node or space to inspect
                        </div>
                    </div>
                </div>
            </div>

            <!-- PANEL 4: mtron Console -->
            <div class="card flex-grow-1 d-flex flex-column">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-terminal me-2"></i>mtron console</span>
                    <div>
                        <button id="clearOutputBtn" class="btn btn-sm btn-outline-secondary me-1" title="Clear Output">
                            <i class="bi bi-trash"></i>
                        </button>
                        <button id="executeBtn" class="btn btn-sm btn-primary" title="Execute (Ctrl+Enter)">
                            <i class="bi bi-play-fill me-1" style="color:white;"></i>Run
                        </button>
                    </div>
                </div>
                <div class="card-body p-0 d-flex flex-column flex-grow-1">
                    <!-- Input Area -->
                    <div class="p-2 border-bottom border-secondary">
                        <textarea id="codeInput" class="form-control code-input" rows="3"
                                  placeholder="enter mtron code here... (ctrl+enter to execute)">1-<[_,_]</textarea>
                    </div>
                    <!-- Output Area -->
                    <div class="flex-grow-1 overflow-auto p-2" style="max-height: calc(100vh - 450px);">
                        <div id="outputContainer" class="output-container">
                            <div class="text-muted small">
                                <i class="bi bi-info-circle me-1"></i>
                                output will appear here...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="footer py-2 bg-dark text-center">
    <div class="text-muted small">
        <span id="statsDisplay">
            <i class="bi bi-reception-4 me-1"></i>Ready
        </span>
    </div>
</footer>

<!-- Dashboard JavaScript -->
<script src="dashboard.js"></script>
</body>
</html>
