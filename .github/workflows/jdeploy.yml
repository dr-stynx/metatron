# This workflow will build a Java project with Maven and bundle them as native app installers with jDeploy
# See https://www.jdeploy.com for more information.

name: jDeploy CI with Maven

on:
  push:
    branches:
      - '*-snapshot'
    tags:
      - 'v*'

concurrency:
  group: jdeploy-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Build App Installer Bundles
        uses: shannah/jdeploy@master
        with:
          deploy_target: github
          github_token: ${{ github.token }}

      - name: Publish to npm
        run: |
          TGZ=$(find ./jdeploy/github-release-files -name "*.tgz" ! -name "*Installer*" -print -quit)
          if [ -n "$TGZ" ] && [ -f "$TGZ" ]; then
            echo "Publishing: $TGZ"
            npm publish "$TGZ" --access public --tag snapshot
          else
            echo "No .tgz found"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
