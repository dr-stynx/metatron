# This workflow will build a Java project with Maven and bundle them as native app installers with jDeploy
# See https://www.jdeploy.com for more information.

name: jDeploy CI with Maven

on:
  push:
    branches:
      - '*-snapshot'
    tags:
      - 'v*'

concurrency:
  group: jdeploy-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Build App Installer Bundles
        uses: shannah/jdeploy@master
        with:
          deploy_target: github
          github_token: ${{ github.token }}

      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc

          TGZ=$(find ./jdeploy/github-release-files -name "*.tgz" ! -name "*Installer*" -print -quit)
          if [ -z "$TGZ" ] || [ ! -f "$TGZ" ]; then
            echo "No .tgz found"
            exit 1
          fi

          mkdir -p npm-publish
          tar xzf "$TGZ" -C npm-publish
          cd npm-publish/package

          # jDeploy regenerates jdeploy.js from its own template during
          # release, ignoring our committed version. Patch it back.
          sed -i 's/var javaVersionString = "11";/var javaVersionString = "21";/' jdeploy-bundle/jdeploy.js
          sed -i 's/var mainClass = "{{MAIN_CLASS}}";/var mainClass = "studio.phaseshift.metatron.BootLoader";/' jdeploy-bundle/jdeploy.js
          sed -i 's/var classPath = "{{CLASSPATH}}";/var classPath = "";/' jdeploy-bundle/jdeploy.js
          sed -i 's/cmd += '\'' -jar "/cmd += '\'' --enable-native-access=ALL-UNNAMED --add-modules jdk.incubator.vector --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/sun.nio.cs=ALL-UNNAMED -jar "/' jdeploy-bundle/jdeploy.js

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm version --no-git-tag-version "$VERSION"
            npm pack
            cd "$GITHUB_WORKSPACE"
            npm publish ./npm-publish/package/*.tgz --access public
          else
            npm version --no-git-tag-version "0.0.0-jdeploy-snapshot.${GITHUB_RUN_NUMBER}"
            npm pack
            cd "$GITHUB_WORKSPACE"
            npm publish ./npm-publish/package/*.tgz --access public --tag snapshot
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
